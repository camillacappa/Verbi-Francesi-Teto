<title>Le Marché des Verbes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a market stall — striped awning band, then a single column of stalls (games), cards set off only where they are tappable */
:root{
  --bg:#F1F6F3; --panel:#FFFFFF; --ink:#1B2740; --muted:#5A6680; --line:#D6E1DA;
  --red:#D8422E; --awn:#FFF8EE; --gold:#E3A21A; --green:#22835A; --blue:#2B5CA6; --violet:#7448BE; --teal:#16848C;
  --ok:#1F8A55; --ko:#CF3A2A; --warn:#C97A06;
  --snail:#9FCB8E;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111926; --panel:#1A2436; --ink:#EDF1F7; --muted:#9BA7BD; --line:#2C3850;
  --red:#EE6A55; --awn:#2A3346; --gold:#F1BD47; --green:#4DBF89; --blue:#80A8EC; --violet:#B597EF; --teal:#59C6CE;
  --ok:#4CC58A; --ko:#F07463; --warn:#F2B04A; --snail:#6FA862; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111926; --panel:#1A2436; --ink:#EDF1F7; --muted:#9BA7BD; --line:#2C3850;
  --red:#EE6A55; --awn:#2A3346; --gold:#F1BD47; --green:#4DBF89; --blue:#80A8EC; --violet:#B597EF; --teal:#59C6CE;
  --ok:#4CC58A; --ko:#F07463; --warn:#F2B04A; --snail:#6FA862; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px;font-weight:800}
.wrap{max-width:880px;margin:0 auto;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* awning */
.awning{position:relative;height:46px;background:repeating-linear-gradient(90deg,var(--red) 0 36px,var(--awn) 36px 72px);margin-bottom:22px}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-17px;height:18px;
  background:radial-gradient(circle at 18px 0,var(--red) 17.5px,transparent 18px),radial-gradient(circle at 54px 0,var(--awn) 17.5px,transparent 18px);background-size:72px 18px}

/* hero */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px}
.hero-text{flex:1 1 300px;min-width:0}
.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--red);margin:0 0 6px}
.hero h1{font-size:clamp(2.3rem,7.5vw,3.7rem);font-weight:700}
.hero h1 span{color:var(--red)}
.lead{color:var(--muted);margin:10px 0 0;max-width:52ch}
.gaston{flex:0 1 260px;display:flex;align-items:flex-end;gap:6px}
.gaston svg{width:120px;flex:none}
.bubble{background:var(--panel);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:.92rem;font-weight:600;margin-bottom:56px;min-width:0}

.cassa{display:flex;align-items:center;gap:14px;margin:22px 0 6px;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--gold) 16%,var(--panel));flex-wrap:wrap}
.coin{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);flex:none}
.cassa-info{flex:1 1 200px;min-width:0}
.cassa-info b{font-family:var(--f-display);font-size:1.4rem}
.lvbar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);margin:6px 0 2px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.cassa small{color:var(--muted)}
.iconbtn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.9rem}

h2.sec{font-size:1.45rem;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:600}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.game{--c:var(--blue);text-align:left;border:2px solid color-mix(in srgb,var(--c) 30%,var(--line));background:var(--panel);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;transition:transform .12s,box-shadow .12s}
.game:hover{transform:translateY(-2px);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.game:active{transform:translateY(1px)}
.game .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c) 16%,var(--panel));flex:none}
.game h3{font-size:1.12rem;font-weight:600;color:var(--c)}
.game p{margin:2px 0 0;font-size:.88rem;color:var(--muted);line-height:1.35}
.game.big{grid-column:1/-1;background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.game.big h3{font-size:1.35rem}

.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.stall{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;text-align:left}
.stall .vi{flex:1;min-width:0}
.stall b{font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.stall .it{color:var(--muted);font-size:.85rem;margin-left:4px}
.tag{--c:var(--blue);display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:20px;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--c);white-space:nowrap}
.stars{color:var(--gold);letter-spacing:1px;font-size:1.05rem;white-space:nowrap}
.stars .off{color:color-mix(in srgb,var(--ink) 18%,transparent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:30px;padding:6px 14px;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.reset{margin-top:28px;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem}

/* game screens */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-weight:800;flex:none}
.tb-title{font-family:var(--f-display);font-weight:600;font-size:1.1rem;white-space:nowrap}
.prog{flex:1;height:12px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:12px;overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;background:var(--green);border-radius:12px;transition:width .3s}
.combo{font-weight:800;opacity:.25;white-space:nowrap}
.combo.on{opacity:1;color:var(--red)}
.coinpill{display:flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap}
.coinpill::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.coinpill.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}

.qcard{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px 20px;margin-top:6px}
.qnum{color:var(--muted);font-weight:700;font-size:.85rem;margin:0 0 10px}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600}
.prompt .pr{color:var(--blue)}
.prompt .plus{color:var(--muted);font-size:.7em}
.prompt .inf{background:color-mix(in srgb,var(--gold) 20%,var(--panel));padding:2px 14px;border-radius:14px}
.itx{text-align:center;color:var(--muted);margin:6px 0 0}
.ask{text-align:center;font-weight:700;margin:18px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 10px;font-family:var(--f-display);font-size:1.25rem;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--ko) 16%,var(--panel));border-color:var(--ko);text-decoration:line-through}
.opt:disabled{cursor:default}
.frase{font-family:var(--f-display);font-size:clamp(1.4rem,4.6vw,1.9rem);font-weight:500;text-align:center;line-height:1.4}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px dashed var(--blue);color:var(--blue)}
.blank.filled{border-bottom-style:solid}
.answer{display:flex;gap:8px;margin-top:20px}
.answer input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-size:1.4rem;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.answer input.ok{border-color:var(--ok)} .answer input.no{border-color:var(--ko)} .answer input.accent{border-color:var(--warn)}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;background:color-mix(in srgb,var(--ink) 10%,var(--panel))}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.15)}
.acc{display:flex;gap:8px;margin-top:10px;justify-content:center}
.key{width:52px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.fb{margin-top:18px;border-radius:16px;padding:14px 16px;border:2px solid;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.fb.no{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--panel))}
.fb.accent{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 11%,var(--panel))}
.fb h3{font-size:1.3rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--ko)} .fb.accent h3{color:var(--warn)}
.sol{font-family:var(--f-display);font-size:1.4rem;font-weight:600;margin:4px 0}
.why{margin:4px 0 12px}
.fb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:none;background:none;font-size:1.05rem;padding:2px 6px;border-radius:8px}
.say:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* conjugation table (boot layout) */
.ctab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.cell{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:var(--bg);border:2px solid transparent;font-size:1.05rem;min-width:0}
.cell .pp{color:var(--muted);font-weight:700;min-width:2.2em}
.cell .ff{font-family:var(--f-display);font-weight:600;font-size:1.15rem;flex:1;min-width:0;overflow-wrap:anywhere}
.cell.hot{background:color-mix(in srgb,var(--c,var(--red)) 13%,var(--panel));border-color:color-mix(in srgb,var(--c,var(--red)) 45%,transparent)}
.rule{--c:var(--blue);border-left:6px solid var(--c);background:var(--panel);border-radius:0 var(--r) var(--r) 0;padding:16px 18px;margin-bottom:14px}
.rule h3{font-size:1.3rem;color:var(--c)}
.rule p{margin:6px 0}
.boot-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;background:var(--panel);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.boot-intro p{margin:6px 0}
@media (max-width:620px){.boot-intro{grid-template-columns:1fr}}
.vpick{margin:6px 0 4px}
.vtable{background:var(--panel);border-radius:var(--r);padding:16px 18px;margin-top:10px}
.vtable h3{font-size:1.6rem}

/* flashcard */
.flash{perspective:1000px;margin:10px auto;max-width:460px}
.fcard{position:relative;height:240px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;border:2px solid var(--line);background:var(--panel)}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--green) 10%,var(--panel));border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.face .big{font-family:var(--f-display);font-size:2.2rem;font-weight:600}
.face small{color:var(--muted)}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{display:block;width:100%;aspect-ratio:1/1.05;max-width:100%;perspective:800px;border:none;background:none;padding:0}
.mc .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .s{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;border:2px solid var(--line)}
.mc .s.front{background:repeating-linear-gradient(45deg,var(--red) 0 12px,color-mix(in srgb,var(--red) 80%,var(--awn)) 12px 24px);border-color:transparent}
.mc .s.front::after{content:"?";font-family:var(--f-display);font-size:2rem;color:#fff;font-weight:700}
.mc .s.face2{transform:rotateY(180deg);background:var(--panel)}
.mc.done .s.face2{background:color-mix(in srgb,var(--ok) 16%,var(--panel));border-color:var(--ok)}
.mp{color:var(--blue);font-weight:800;font-size:.95rem}
.mi{font-family:var(--f-display);font-weight:600;font-size:clamp(.95rem,3.4vw,1.2rem)}
.mf{font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,3.8vw,1.35rem);color:var(--green);overflow-wrap:anywhere;text-align:center}

/* lampo */
.lampo-head{display:flex;justify-content:space-between;align-items:center}
.clock{font-family:var(--f-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.clock.hurry{color:var(--ko)}
.lscore{font-weight:800;font-size:1.1rem}
.lq{font-family:var(--f-display);font-size:clamp(2rem,7vw,2.8rem);font-weight:600;text-align:center;margin:26px 0;min-height:1.4em}
.lq.okf{color:var(--ok)} .lq.kof{color:var(--ko)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .btn{padding:20px 10px;font-size:1.2rem}
.vf-yes{background:color-mix(in srgb,var(--ok) 20%,var(--panel))!important;color:var(--ok)}
.vf-no{background:color-mix(in srgb,var(--ko) 18%,var(--panel))!important;color:var(--ko)}
.lfb{text-align:center;min-height:1.6em;margin-top:12px;font-weight:700}

/* tabella */
.tab-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
@media (max-width:480px){.tab-in{grid-template-columns:1fr}}
.tin{display:flex;flex-direction:column;gap:3px}
.tin label{font-weight:800;color:var(--blue);font-size:.9rem}
.tin input{font:inherit;font-family:var(--f-display);font-size:1.2rem;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.tin input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.tin input.no{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 8%,var(--bg))}
.tin input.accent{border-color:var(--warn)}
.tin .hint{font-size:.85rem;font-weight:700;min-height:1.2em}
.tin .hint.no{color:var(--ko)} .tin .hint.accent{color:var(--warn)} .tin .hint.ok{color:var(--ok)}

/* trucco */
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:480px){.baskets{grid-template-columns:1fr}}
.basket{--c:var(--blue);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--panel));border-radius:14px;padding:12px;text-align:left;font-weight:700}
.basket b{font-family:var(--f-display);color:var(--c);font-size:1.15rem;display:block}
.basket span{font-size:.85rem;color:var(--muted);font-weight:600}
.basket.right{outline:3px solid var(--ok)} .basket.wrong{outline:3px solid var(--ko);opacity:.7}

/* end */
.end{text-align:center}
.end .bigstars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.end .bigstars .off{color:color-mix(in srgb,var(--ink) 15%,transparent)}
.end h2{font-size:2rem;margin:6px 0}
.voto{display:inline-block;font-family:var(--f-display);font-size:3rem;font-weight:700;background:var(--ink);color:var(--bg);border-radius:20px;padding:4px 22px;margin:8px 0}
.errs{text-align:left;margin:18px auto 0;max-width:520px}
.errs li{margin:6px 0}
.errs .w{color:var(--ko);text-decoration:line-through}
.errs .r{color:var(--ok);font-weight:800}
.endbtns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ===================== DATI ===================== */
const P=['je','tu','il','nous','vous','ils'];
const PL=['je','tu','il/elle','nous','vous','ils/elles'];
// [x] = la parte che cambia (evidenziata)
const VERBI=[
 {inf:'acheter',  it:'comprare',   g:'e',   f:['ach[è]te','ach[è]tes','ach[è]te','achetons','achetez','ach[è]tent']},
 {inf:'peser',    it:'pesare',     g:'e',   f:['p[è]se','p[è]ses','p[è]se','pesons','pesez','p[è]sent']},
 {inf:'lever',    it:'alzare',     g:'e',   f:['l[è]ve','l[è]ves','l[è]ve','levons','levez','l[è]vent']},
 {inf:'préférer', it:'preferire',  g:'é',   f:['préf[è]re','préf[è]res','préf[è]re','préférons','préférez','préf[è]rent']},
 {inf:'jeter',    it:'gettare, buttare', g:'dbl', f:['je[tt]e','je[tt]es','je[tt]e','jetons','jetez','je[tt]ent']},
 {inf:'appeler',  it:'chiamare',   g:'dbl', f:['appe[ll]e','appe[ll]es','appe[ll]e','appelons','appelez','appe[ll]ent']},
 {inf:'manger',   it:'mangiare',   g:'ger', f:['mange','manges','mange','mang[e]ons','mangez','mangent']},
 {inf:'commencer',it:'cominciare', g:'cer', f:['commence','commences','commence','commen[ç]ons','commencez','commencent']},
 {inf:'essayer',  it:'provare',    g:'y',   f:['essa[i]e','essa[i]es','essa[i]e','essayons','essayez','essa[i]ent'], alt:{0:'essaye',1:'essayes',2:'essaye',5:'essayent'}},
 {inf:'payer',    it:'pagare',     g:'y',   f:['pa[i]e','pa[i]es','pa[i]e','payons','payez','pa[i]ent'], alt:{0:'paye',1:'payes',2:'paye',5:'payent'}},
];
const GR={
 e:  {nome:'e → è', c:'--blue', breve:'la e diventa è',
      testo:"La <b>e</b> della radice prende l'accento grave e diventa <b>è</b>, ma solo nella scarpa (je, tu, il, ils). Con nous e vous resta come all'infinito."},
 'é':{nome:'é → è', c:'--violet', breve:"l'accento cambia verso",

const marked=s=>esc(s).replace(/\[(.+?)\]/g,'<mark>$1</mark>');
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const BOOT=[0,1,2,5];
const bootSet=v=>(v.g==='ger'||v.g==='cer')?[3]:BOOT;
function rp(i){return i===2?pick(['il','elle']):i===5?pick(['ils','elles']):P[i];}
function prn(i,form,p){if(i===0&&/^[aeiouyhéèêâ]/i.test(form))return "j'";return (p||P[i])+' ';}
const full=(i,form,p)=>prn(i,form,p)+form;
function acc(v,i){const a=[plain(v.f[i])]; if(v.alt&&v.alt[i]) a.push(v.alt[i]); return a;}
const accFull=(v,i,p)=>acc(v,i).map(f=>full(i,f,p)).join(' / ');
function norm(s){
  s=(s||'').normalize('NFC').toLowerCase().replace(/[’`´‘]/g,"'").replace(/\s+/g,' ').trim();
  s=s.replace(/^(j' ?|je |tu |il |elle |on |nous |vous |ils |elles )/,'').replace(/^(m' ?|t' ?|s' ?|me |te |se )/,'');
  return s.replace(/[.!?]$/,'').trim();
}
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function check(v,i,inp){const n=norm(inp),a=acc(v,i); if(!n)return 'no'; if(a.includes(n))return 'ok'; if(a.some(x=>deacc(x)===deacc(n)))return 'accent'; return 'no';}
function wrongs(v,i){
  const ok=acc(v,i),f=ok[0],mut=new Set(),per=new Set();
  const add=(set,x)=>{if(x&&!ok.includes(x))set.add(x)};
  [f.replace(/è/g,'e'),f.replace(/è/g,'é'),f.replace(/é/g,'e'),f.replace(/ç/g,'c'),f.replace(/geons$/,'gons'),f.replace(/tt/,'t'),f.replace(/ll/,'l')].forEach(x=>add(mut,x));
  if(i===3||i===4){
    [f.replace(/e(?=[^aeiouyéèç]+(ons|ez)$)/,'è'),f.replace(/é(?=[^aeiouyéè]+(ons|ez)$)/,'è'),f.replace(/t(ons|ez)$/,'tt$1'),f.replace(/l(ons|ez)$/,'ll$1'),f.replace(/y(ons|ez)$/,'i$1')].forEach(x=>add(mut,x));
  }
  v.f.forEach((x,j)=>{if(j!==i)add(per,plain(x))});
  [...mut].forEach(x=>per.delete(x));
  return {mut:[...mut],per:[...per]};
}

}
let recent=[],recentFR=[];
function pickVI(){
  const vs=active(),items=[];
  vs.forEach(v=>{for(let i=0;i<6;i++){const k=v.inf+'|'+i; if(recent.includes(k))continue; const s=st(v.inf,i); items.push({v,i,k,w:1+Math.min(s.ko,3)*.8+(s.s<3?1.2:0)});}});
  if(!items.length){recent=[];return pickVI();}
  let r=Math.random()*items.reduce((a,b)=>a+b.w,0),it=items[items.length-1];
  for(const x of items){r-=x.w;if(r<=0){it=x;break;}}
  recent.push(it.k); if(recent.length>Math.min(10,vs.length*6-1))recent.shift();
  return it;
}
function pickFR(){
  const act=active().map(v=>v.inf); let pool=FR.filter((x,k)=>act.includes(x[0])&&!recentFR.includes(k));
  if(!pool.length){recentFR=[];pool=FR.filter(x=>act.includes(x[0]));}
  const x=pick(pool); recentFR.push(FR.indexOf(x)); return x;
}

function verbStars(v){let t=0;for(let i=0;i<6;i++)t+=Math.min(st(v.inf,i).s,3);return t>=18?3:t>=10?2:t>=4?1:0;}

let AC=null;
function beep(type){
  if(S.mute)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const N=type==='ok'?[660,880]:type==='ko'?[260,190]:type==='win'?[523,659,784,1046]:[520];
    N.forEach((fq,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fq;const t=AC.currentTime+k*.09;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='ko'?.12:.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.22);});
  }catch(e){}
}
function speak(t){
  try{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;
    const fv=speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang)); if(fv)u.voice=fv;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

  const cs=getComputedStyle(document.documentElement),cols=['--red','--gold','--green','--blue','--violet','--teal'].map(k=>cs.getPropertyValue(k).trim());
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:pick(cols)}));
  const t0=performance.now();
  (function fr(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(t-t0<2800)requestAnimationFrame(fr);else{x.clearRect(0,0,c.width,c.height);c.hidden=true;}})(t0);
}

let lastInput=null;

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-mc],#fc');if(!t)return;
  if(t.dataset.say!==undefined){speak(t.dataset.say);return;}
  if(t.dataset.go){go(t.dataset.go,t.dataset.arg);return;}
  if(t.dataset.ch){const inp=(lastInput&&document.body.contains(lastInput)&&!lastInput.readOnly)?lastInput:null;if(!inp)return;
    const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+t.dataset.ch+inp.value.slice(en);inp.setSelectionRange(s+1,s+1);inp.focus();return;}
  if(t.dataset.verb){const k=t.dataset.verb,i=S.off.indexOf(k);if(i>=0)S.off.splice(i,1);else if(S.off.length<VERBI.length-1)S.off.push(k);save();home();return;}
  if(t.dataset.rv){regole(t.dataset.rv);return;}
  if(t.dataset.tv){startTabella(t.dataset.tv);return;}
  if(t.dataset.k!==undefined&&G){const k=+t.dataset.k,q=G.cur;answerQ(acc(q.v,q.i).includes(q.opts[k])?'ok':'no',k);return;}
  if(t.dataset.mc!==undefined){memClick(+t.dataset.mc);return;}
  if(t.dataset.vf!==undefined){answerL(t.dataset.vf==='1');return;}
  if(t.dataset.bk){truccoAns(t.dataset.bk);return;}
  switch(t.id){
    case 'chk':{const a=$('#ans');if(!a.value.trim()){a.focus();return;}const q=G.cur;answerQ(check(q.v,q.i,a.value),a.value);return;}
    case 'nx':G.idx++;nextQ();return;
    case 'fc':case 'fturn':flipFlash();return;
    case 'fyes':flashAns(true);return;
    case 'fno':flashAns(false);return;
    case 'tchk':checkTabella();return;
    case 'tnx':T.idx++;renderTrucco();return;
    case 'mute':S.mute=!S.mute;save();home();return;
    case 'reset':if(!resetArm){resetArm=true;home();setTimeout(()=>{resetArm=false;},5000);return;}
      S={coins:0,st:{},off:[],best:{lampo:0},mute:S.mute};save();resetArm=false;home();return;
  }
});
document.addEventListener('keydown',e=>{
  if(L&&!L.over){if(e.key==='ArrowLeft'){answerL(false);e.preventDefault();}if(e.key==='ArrowRight'){answerL(true);e.preventDefault();}return;}
  if(e.key!=='Enter')return;
  if(G&&G.cur&&document.body.contains($('#fb'))&&$('.qcard .qnum')&&G.cur.answered&&$('#nx')){e.preventDefault();G.idx++;nextQ();return;}
  if(e.target.id==='ans'&&G&&!G.cur.answered){e.preventDefault();$('#chk').click();return;}
  if(e.target.id&&/^t\d$/.test(e.target.id)&&TB&&TB.stage<2){e.preventDefault();const i=+e.target.id[1],order=[0,1,2,3,4,5],nx=order.find(j=>j>i&&TB.res[j]!=='ok');if(nx!==undefined)$('#t'+nx).focus();else checkTabella();return;}
  if($('#tnx')&&T&&T.done){e.preventDefault();T.idx++;renderTrucco();return;}
  if(e.target.id==='fc'){flipFlash();}
});
try{speechSynthesis.getVoices();}catch(e){}
home();
</script>
